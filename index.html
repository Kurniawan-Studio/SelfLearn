  var prioritySelect=el('select',{class:'select',style:{marginBottom:'var(--sp-3)'}},
    el('option',{value:'high'},'Prioritas Tinggi'),
    el('option',{value:'medium',selected:'selected'},'Prioritas Sedang'),
    el('option',{value:'low'},'Prioritas Rendah')
  );
  var submitBtn=el('button',{class:'btn btn-pri'},'Tambah Tugas');
  submitBtn.addEventListener('click',function(){
    var title=input.value.trim();
    if(!title){toast('Judul tugas tidak boleh kosong','err');return;}
    var st=store.get();
    st.tasks.push({
      id:uid('task'),title:title,
      dueDate:dateInput.value||null,
      priority:prioritySelect.value,
      completed:false,
      createdAt:new Date().toISOString()
    });
    store.save();
    input.value='';dateInput.value='';
    toast('Tugas ditambahkan','ok');
    handleRoute();
  });
  form.append(input,dateInput,prioritySelect,submitBtn);
  content.append(form);

  var tasks=s.tasks.slice().sort(function(a,b){
    if(a.completed!==b.completed)return a.completed?1:-1;
    var pOrder={high:0,medium:1,low:2};
    if(pOrder[a.priority]!==pOrder[b.priority])return pOrder[a.priority]-pOrder[b.priority];
    if(a.dueDate&&b.dueDate)return a.dueDate.localeCompare(b.dueDate);
    return 0;
  });

  if(!tasks.length){
    content.append(el('div',{class:'empty'},
      el('div',{class:'empty-ttl'},'Belum ada tugas'),
      el('div',{class:'empty-txt'},'Tambahkan tugas untuk mulai merencanakan.')
    ));
  } else {
    tasks.forEach(function(t){
      var row=el('div',{class:'task-row'+(t.completed?' done':'')});
      var cb=el('button',{class:'task-cb','aria-label':'Toggle task'});
      cb.innerHTML=I.check;
      cb.addEventListener('click',function(){
        var st=store.get();
        var task=st.tasks.find(function(x){return x.id===t.id;});
        if(task){task.completed=!task.completed;store.save();handleRoute();}
      });
      var bd=el('div',{class:'task-bd'});
      bd.innerHTML='<div class="task-ttl">'+esc(t.title)+'</div>'+
        '<div class="task-meta">'+
        '<span>'+(t.priority==='high'?'🔴':t.priority==='medium'?'🟡':'🟢')+' '+t.priority+'</span>'+
        (t.dueDate?'<span>📅 '+fmtDate(t.dueDate)+'</span>':'')+
        '</div>';
      var delBtn=el('button',{class:'btn btn-ghost btn-sm','aria-label':'Hapus'});
      delBtn.innerHTML=I.trash;
      delBtn.addEventListener('click',function(){
        confirmModal({
          title:'Hapus tugas?',body:'Tugas akan dihapus permanen.',confirmLabel:'Hapus',
          onConfirm:function(){
            var st=store.get();
            st.tasks=st.tasks.filter(function(x){return x.id!==t.id;});
            store.save();handleRoute();
          }
        });
      });
      row.append(cb,bd,delBtn);
      content.append(row);
    });
  }

  renderShell(content,{title:'Planner',subtitle:tasks.filter(function(t){return !t.completed;}).length+' tugas aktif'});
}

var focusState={mode:'pomodoro',running:false,seconds:25*60,initial:25*60,interval:null};

function pageFocus(){
  var content=el('div',{class:'content'});
  content.append(el('div',{style:{marginBottom:'var(--sp-5)',textAlign:'center'}},
    el('h1',{style:{marginBottom:'var(--sp-2)'}},'Focus Mode'),
    el('p',{style:{maxWidth:'560px',margin:'0 auto'}},'Timer Pomodoro untuk sesi belajar bebas distraksi.')
  ));

  var stage=el('div',{class:'focus-stage'});
  var modes=el('div',{class:'focus-modes'});
  var modeData=[{id:'pomodoro',label:'Pomodoro (25m)',secs:25*60},{id:'short',label:'Short Break (5m)',secs:5*60},{id:'long',label:'Long Break (15m)',secs:15*60}];
  modeData.forEach(function(m){
    var b=el('button',{class:'focus-mode'+(focusState.mode===m.id?' active':'')},m.label);
    b.addEventListener('click',function(){
      if(focusState.running){toast('Hentikan timer dulu','err');return;}
      focusState.mode=m.id;
      focusState.initial=m.secs;
      focusState.seconds=m.secs;
      handleRoute();
    });
    modes.append(b);
  });
  stage.append(el('div',{class:'focus-lbl'},'Mode'),modes);

  var display=el('div',{class:'focus-time'});
  var updateDisplay=function(){
    var m=Math.floor(focusState.seconds/60);
    var s=focusState.seconds%60;
    display.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;
  };
  updateDisplay();
  stage.append(display);

  var controls=el('div',{style:{display:'flex',gap:'var(--sp-3)',justifyContent:'center',marginTop:'var(--sp-3)'}});
  var startBtn=el('button',{class:'btn btn-pri btn-lg'});
  var resetBtn=el('button',{class:'btn btn-sec'});
  resetBtn.innerHTML=I.reset+' Reset';
  resetBtn.addEventListener('click',function(){
    if(focusState.interval){clearInterval(focusState.interval);focusState.interval=null;}
    focusState.running=false;
    focusState.seconds=focusState.initial;
    updateDisplay();updateStartBtn();
  });

  var updateStartBtn=function(){
    startBtn.innerHTML=focusState.running?I.pause+' Pause':I.play+' Mulai';
  };
  startBtn.addEventListener('click',function(){
    if(focusState.running){
      clearInterval(focusState.interval);focusState.interval=null;
      focusState.running=false;
    } else {
      focusState.running=true;
      focusState.interval=setInterval(function(){
        focusState.seconds--;
        updateDisplay();
        if(focusState.seconds<=0){
          clearInterval(focusState.interval);focusState.interval=null;
          focusState.running=false;
          updateStartBtn();
          onFocusComplete();
        }
      },1000);
    }
    updateStartBtn();
  });
  updateStartBtn();

  controls.append(startBtn,resetBtn);
  stage.append(controls);

  var s=store.get();
  if(s.progress.focusSessions.length){
    var hist=el('div',{style:{maxWidth:'520px',margin:'var(--sp-6) auto 0'}});
    hist.append(el('h3',{style:{marginBottom:'var(--sp-3)',fontSize:'var(--fs-md)'}},'Riwayat Sesi'));
    var recent=s.progress.focusSessions.slice(-5).reverse();
    recent.forEach(function(f){
      hist.append(el('div',{class:'task-row'},
        el('div',{class:'task-bd'},
          el('div',{class:'task-ttl'},Math.round(f.duration/60)+' menit fokus'),
          el('div',{class:'task-meta'},fmtDate(f.date))
        )
      ));
    });
    stage.append(hist);
  }

  content.append(stage);
  renderShell(content,{title:'Focus Mode',subtitle:'Bebas distraksi'});

  function onFocusComplete(){
    var st=store.get();
    st.progress.focusSessions.push({duration:focusState.initial,date:new Date().toISOString()});
    addPoints(20);
    recordActivity(Math.round(focusState.initial/60));
    checkAchievements();
    store.save();
    toast('Sesi fokus selesai! +20 points','ok');
    if('Notification' in window&&Notification.permission==='granted'){
      new Notification('Sesi Fokus Selesai',{body:'Waktunya istirahat sejenak.'});
    }
  }
}

function pageAnalytics(){
  var s=store.get();
  var stats=computeStats();
  var content=el('div',{class:'content'});
  content.append(el('div',{style:{marginBottom:'var(--sp-5)'}},
    el('h1',{style:{marginBottom:'var(--sp-2)'}},'Analytics'),
    el('p',{style:{maxWidth:'560px'}},'Statistik berdasarkan aktivitas belajar Anda yang sebenarnya.')
  ));

  var summary=el('div',{class:'grid grid-4',style:{marginBottom:'var(--sp-5)'}});
  var sumData=[
    {lbl:'Streak',val:stats.streak,sub:'Terpanjang: '+stats.longestStreak},
    {lbl:'Total Belajar',val:stats.totalHours+'j',sub:stats.totalMinutes+' menit'},
    {lbl:'Lesson',val:stats.completedLessons+'/'+LESSONS.length,sub:Math.round((stats.completedLessons/LESSONS.length)*100)+'% selesai'},
    {lbl:'Quiz',val:stats.quizzesTaken,sub:stats.avgScore!==null?'Rata-rata: '+stats.avgScore+'%':'Belum ada'}
  ];
  sumData.forEach(function(d){
    summary.append(el('div',{class:'stat'},
      el('div',{class:'stat-lbl'},d.lbl),
      el('div',{class:'stat-val'},String(d.val)),
      el('div',{class:'stat-meta'},d.sub)
    ));
  });
  content.append(summary);

  content.append(el('div',{class:'chart-card'},
    el('div',{class:'chart-ttl'},'Aktivitas 7 Hari Terakhir'),
    (function(){
      var week=weeklyActivity();
      var max=Math.max.apply(null, week.map(function(d){return d.minutes;}).concat([1]));
      var wrap=el('div',{class:'chart-wrap'});
      var barsHTML = week.map(function(d,i){
        var x=40+i*95;
        var h=(d.minutes/max)*150;
        var y=180-h;
        return '<rect class="chart-bar" x="'+x+'" y="'+y+'" width="60" height="'+h+'" rx="4" opacity="0.9"/>'+
          '<text class="chart-axis" x="'+(x+30)+'" y="195" text-anchor="middle">'+d.label+'</text>'+
          '<text class="chart-axis" x="'+(x+30)+'" y="'+(y-6)+'" text-anchor="middle">'+d.minutes+'m</text>';
      }).join('');
      wrap.innerHTML='<svg viewBox="0 0 700 200">'+barsHTML+'</svg>';
      return wrap;
    })()
  ));

  content.append(el('div',{class:'chart-card'},
    el('div',{class:'chart-ttl'},'Distribusi Kategori'),
    (function(){
      var catCount={};
      Object.keys(s.progress.lessons).forEach(function(lessonId){
        if(!s.progress.lessons[lessonId].completed)return;
        var l=LESSONS.find(function(x){return x.id===lessonId;});
        if(l)catCount[l.category]=(catCount[l.category]||0)+1;
      });
      var entries=Object.keys(catCount).map(function(k){return [k,catCount[k]];});
      if(!entries.length){
        return el('div',{class:'muted sm'},'Belum ada lesson yang selesai.');
      }
      var wrap=el('div',{style:{display:'flex',flexDirection:'column',gap:'var(--sp-3)'}});
      var max=Math.max.apply(null, entries.map(function(e){return e[1];}).concat([1]));
      entries.forEach(function(arr){
        var cat=CATEGORIES.find(function(c){return c.id===arr[0];});
        var row=el('div');
        row.innerHTML='<div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:var(--fs-sm)">'+
          '<span>'+esc(cat?cat.name:arr[0])+'</span>'+
          '<span class="muted">'+arr[1]+'</span>'+
          '</div>'+
          '<div class="prog prog-sm"><div class="prog-bar" style="width:'+((arr[1]/max)*100)+'%"></div></div>';
        wrap.append(row);
      });
      return wrap;
    })()
  ));

  renderShell(content,{title:'Analytics'});
}

function pageSearch(){
  var s=store.get();
  var content=el('div',{class:'content'});
  content.append(el('h1',{style:{marginBottom:'var(--sp-4)'}},'Cari'));

  var box=el('div',{class:'search-box'});
  box.innerHTML=I.search;
  var input=el('input',{class:'input',type:'search',placeholder:'Cari lesson, catatan, kartu, tugas...',id:'search-input'});
  box.append(input);
  content.append(box);

  var results=el('div',{id:'search-results'});
  content.append(results);

  var performSearch=function(q){
    results.innerHTML='';
    if(!q.trim()){results.innerHTML='<div class="muted sm" style="padding:var(--sp-4)">Mulai mengetik untuk mencari.</div>';return;}
    var ql=q.toLowerCase();
    var count=0;

    LESSONS.forEach(function(l){
      if(l.title.toLowerCase().indexOf(ql)>-1||l.desc.toLowerCase().indexOf(ql)>-1){
        var r=el('div',{class:'search-res'});
        r.innerHTML='<div class="search-res-t"><span class="search-res-type">Lesson</span>'+esc(l.title)+'</div><div class="search-res-m">'+esc(l.desc.substring(0,100))+'...</div>';
        r.addEventListener('click',function(){navigate('/lesson/'+l.id);});
        results.append(r);count++;
      }
    });

    s.notes.forEach(function(n){
      if(n.title.toLowerCase().indexOf(ql)>-1||(n.content||'').toLowerCase().indexOf(ql)>-1){
        var r=el('div',{class:'search-res'});
        r.innerHTML='<div class="search-res-t"><span class="search-res-type">Note</span>'+esc(n.title)+'</div><div class="search-res-m">'+esc((n.content||'').substring(0,100))+'...</div>';
        r.addEventListener('click',function(){navigate('/notes/'+n.id);});
        results.append(r);count++;
      }
    });

    s.flashcards.forEach(function(c){
      if((c.front||'').toLowerCase().indexOf(ql)>-1||(c.back||'').toLowerCase().indexOf(ql)>-1){
        var r=el('div',{class:'search-res'});
        r.innerHTML='<div class="search-res-t"><span class="search-res-type">Kartu</span>'+esc(c.front)+'</div><div class="search-res-m">'+esc(c.back.substring(0,100))+'</div>';
        r.addEventListener('click',function(){navigate('/flashcards');});
        results.append(r);count++;
      }
    });

    s.tasks.forEach(function(t){
      if(t.title.toLowerCase().indexOf(ql)>-1){
        var r=el('div',{class:'search-res'});
        r.innerHTML='<div class="search-res-t"><span class="search-res-type">Tugas</span>'+esc(t.title)+'</div><div class="search-res-m">'+(t.completed?'Selesai':'Aktif')+'</div>';
        r.addEventListener('click',function(){navigate('/planner');});
        results.append(r);count++;
      }
    });

    if(count===0){
      results.innerHTML='<div class="empty"><div class="empty-ttl">Tidak ada hasil</div><div class="empty-txt">Tidak ditemukan untuk "'+esc(q)+'".</div></div>';
    }
  };

  input.addEventListener('input',debounce(function(){performSearch(input.value);},200));
  setTimeout(function(){input.focus();},50);

  renderShell(content,{title:'Cari'});
}

function computeStats(){
  var s=store.get();
  var lessons=Object.keys(s.progress.lessons).map(function(k){return s.progress.lessons[k];});
  var completedLessons=lessons.filter(function(l){return l.completed;}).length;
  var totalMinutes=0;
  Object.keys(s.progress.dailyMinutes).forEach(function(k){totalMinutes+=s.progress.dailyMinutes[k];});
  
  var totalHours=(totalMinutes/60).toFixed(1);
  var quizzesTaken=Object.keys(s.progress.quizzes).length;
  var quizScores=[];
  Object.keys(s.progress.quizzes).forEach(function(k){
    var q=s.progress.quizzes[k];
    if(q.attempts)q.attempts.forEach(function(a){quizScores.push(a);});
  });
  var avgScore=quizScores.length?Math.round(quizScores.reduce(function(a,b){return a+(b.score/b.total)*100;},0)/quizScores.length):null;
  
  return{
    completedLessons:completedLessons,totalMinutes:totalMinutes,totalHours:totalHours,
    quizzesTaken:quizzesTaken,avgScore:avgScore,streak:s.progress.streak.current,
    longestStreak:s.progress.streak.longest,level:s.progress.level,points:s.progress.points
  };
}

function weeklyActivity(){
  var s=store.get();
  var days=[];
  for(var i=6;i>=0;i--){
    var d=new Date();d.setDate(d.getDate()-i);
    var iso=d.toISOString().slice(0,10);
    days.push({iso:iso,minutes:s.progress.dailyMinutes[iso]||0,label:['Min','Sen','Sel','Rab','Kam','Jum','Sab'][d.getDay()]});
  }
  return days;
}
